services:
  # --- BASE DE DATOS DE GRAFOS ---
  neo4j:
    image: neo4j:latest
    container_name: papilio_graph
    ports:
      - "7474:7474"
      - "7687:7687"
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "http://localhost:7474", "-O", "/dev/null", "-q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./neo4j_data:/data

  # --- INFRAESTRUCTURA DE EVENTOS ---
  papilio_kafka:
    image: confluentinc/cp-kafka:latest
    container_name: papilio_kafka
    ports:
      - "9092:9092"   # Acceso desde tu host (localhost)
      - "29092:29092" # Acceso interno (Papilio Network)
    env_file: .env
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  papilio_monitor:
    image: tchiotludo/akhq:latest
    container_name: papilio_akhq
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - papilio_kafka

  # --- LÓGICA DEL PROYECTO ---
  app:
    build: .
    container_name: papilio_logic
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./app:/app/app
    depends_on:
      neo4j:
        condition: service_healthy
      papilio_kafka:
        condition: service_started

  app_ingestor:
    build: .
    container_name: papilio_ingestor
    command: python app/ingestor.py
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./app:/app/app
    depends_on:
      - papilio_kafka
      - neo4j
    env_file: .env

  # --- INTERFAZ INTELIGENTE (Ollama) ---
  ollama:
    image: ollama/ollama:latest
    container_name: papilio_ollama
    volumes:
      - ollama_storage:/root/.ollama
    ports:
      - "11434:11434"
    env_file: .env

  ollama-model-puller:
    image: curlimages/curl:latest
    container_name: papilio_ollama_puller
    volumes:
      - .:/modelfiles
    depends_on:
      - ollama
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo '⏳ Esperando a que Ollama esté listo...'
      until curl -s http://ollama:11434/api/tags > /dev/null; do sleep 5; done
      echo '📦 Descargando modelo llama3.2 para Papilio Logic...'
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"llama3.2\"}'
      echo '✅ Modelo listo para el muelle.'
      docker exec ollama ollama create papilio-analyst -f /modelfiles/PapilioModelfile
      echo '✅ Analista operativo en el muelle.'
      "

volumes:
  ollama_storage: