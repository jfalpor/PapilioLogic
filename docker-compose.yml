services:
  # --- BASE DE DATOS DE GRAFOS ---
  neo4j:
    image: neo4j:5.12
    container_name: papilio_graph
    ports:
      - "7474:7474"
      - "7687:7687"
    env_file: .env
    environment:
      # Forzamos la lectura de las variables del .env
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_config_strict__validation_enabled=false
    healthcheck:
      test: ["CMD", "wget", "http://localhost:7474", "-O", "/dev/null", "-q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    volumes:
      - ./neo4j_data:/data

  # --- INFRAESTRUCTURA DE EVENTOS ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: papilio_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: papilio_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    env_file: .env
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: papilio_zookeeper:2181
      # CORRECCIÓN: Usamos el container_name 'papilio_kafka' para la red interna
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,CONNECTOR://papilio_kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONNECTOR:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: CONNECTOR
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  akhq:
    image: tchiotludo/akhq:latest
    container_name: papilio_akhq
    ports:
      - "8080:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            portnexus-kafka: # CORRECCIÓN: Coincide con lo que buscan tus logs
              properties:
                bootstrap.servers: "papilio_kafka:29092"
    depends_on:
      - kafka

  # --- LÓGICA DEL PROYECTO ---
  app:
    build: .
    container_name: papilio_logic
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_started

  # --- INTERFAZ INTELIGENTE (Ollama) ---
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: papilio_ai_brain
    env_file: .env
    volumes:
      - ./ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always